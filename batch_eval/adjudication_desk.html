<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Adjudication desk — TOWN04_HW_01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500..800&family=IBM+Plex+Mono:wght@400;500&family=Lora:ital,wght@0,400..700;1,400..700&family=Public+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Transport for NSW–style palette */
      --navy: #002664;
      --navy-2: #0A3272;
      --navy-3: #22407E;
      --red: #D7153A;
      --red-dk: #A30F2C;
      --red-tint: #FBE4E8;
      --blue: #146CFD;
      --sky: #CBEDFD;
      --sky-2: #E6F6FE;
      --paper: #E9EDF3;
      --card: #F7F9FC;
      --card-2: #EFF3F8;
      --ink: #1A2233;
      --slate: #3B4A63;
      --muted: #5F6D82;
      --line: #CAD3DF;
      --line-2: #DDE3EB;

      --sans: "Public Sans", system-ui, sans-serif;
      --serif: Constantia, "Lora", "Palatino Linotype", Georgia, serif;
      /* Constantia on Windows, Lora elsewhere */
      --display: "Fraunces", Constantia, Georgia, serif;
      /* recommendation only */
      --mono: "IBM Plex Mono", ui-monospace, monospace;

      --lift: 0 1px 2px rgba(0, 38, 100, .06), 0 6px 18px -8px rgba(0, 38, 100, .22);
      --ease: cubic-bezier(.22, .8, .26, 1);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      height: 100%
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased
    }

    button {
      font: inherit;
      cursor: pointer
    }

    .wrap {
      display: grid;
      grid-template-columns: 292px minmax(0, 1fr);
      height: 100vh
    }

    /* ---------- motion ---------- */
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes fade {
      from {
        opacity: 0
      }

      to {
        opacity: 1
      }
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-8px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes flash {
      0% {
        background: var(--blue);
        color: #fff
      }

      100% {
        background: var(--sky)
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: .35
      }

      50% {
        opacity: 1
      }
    }

    @keyframes stamp {
      0% {
        opacity: 0;
        transform: scale(1.04);
        letter-spacing: 1px
      }

      100% {
        opacity: 1;
        transform: none;
        letter-spacing: -.6px
      }
    }

    .rise {
      animation: rise .5s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 70ms)
    }

    /* ---------- docket rail ---------- */
    .rail {
      background: var(--navy);
      color: #D5DEEC;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .rail header {
      padding: 24px 22px 18px
    }

    .rail .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #8EA3C6
    }

    .rail h1 {
      margin: 4px 0 0;
      font-family: var(--serif);
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      letter-spacing: .1px
    }

    .rail .site {
      margin-top: 10px;
      display: inline-block;
      padding: 3px 9px;
      border-radius: 3px;
      background: var(--navy-2);
      font-family: var(--mono);
      font-size: 12px;
      color: #C4D2E8
    }

    .rail .count {
      padding: 0 22px 8px;
      font-size: 12px;
      color: #8EA3C6
    }

    .docket {
      flex: 1;
      overflow-y: auto;
      padding: 4px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .case-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      padding: 12px 14px;
      color: #C4D2E8;
      border-radius: 6px;
      transition: background .2s var(--ease), border-color .2s, transform .2s var(--ease), color .2s
    }

    .docket.first .case-btn {
      animation: slideIn .45s var(--ease) both;
      animation-delay: calc(var(--i, 0) * 45ms)
    }

    .case-btn:hover {
      background: var(--navy-2);
      transform: translateX(2px)
    }

    .case-btn[aria-current="true"] {
      background: var(--card);
      border-color: var(--card);
      color: var(--ink);
      transform: none
    }

    .case-btn .cid {
      font-family: var(--mono);
      font-size: 11px;
      color: #8EA3C6;
      display: block;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .case-btn[aria-current="true"] .cid {
      color: var(--muted)
    }

    .case-btn .pair {
      display: block;
      font-size: 13.5px;
      line-height: 1.35;
      font-weight: 500
    }

    .case-btn .vbadge {
      margin-top: 8px
    }

    .rail footer {
      padding: 14px 22px;
      font-size: 11.5px;
      color: #8EA3C6;
      border-top: 1px solid var(--navy-3)
    }

    /* verdict badges — red / navy / grey only */
    .vbadge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase
    }

    .v-likely_breach {
      background: var(--red);
      color: #fff
    }

    .v-possible_breach {
      background: var(--red-tint);
      color: var(--red-dk);
      box-shadow: inset 0 0 0 1px var(--red)
    }

    .v-insufficient_evidence,
    .v-unlikely_breach,
    .v-pending {
      background: #D9DFE8;
      color: var(--slate)
    }

    .rail .v-insufficient_evidence,
    .rail .v-unlikely_breach,
    .rail .v-pending {
      background: var(--navy-3);
      color: #D5DEEC
    }

    .rail .case-btn[aria-current="true"] .v-insufficient_evidence,
    .rail .case-btn[aria-current="true"] .v-unlikely_breach,
    .rail .case-btn[aria-current="true"] .v-pending {
      background: #D9DFE8;
      color: var(--slate)
    }

    /* ---------- main ---------- */
    main {
      overflow-y: auto;
      padding: 30px 40px 72px
    }

    .inner {
      max-width: 1120px;
      margin: 0 auto
    }

    /* recommendation card */
    .verdict {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 26px 30px 28px;
      margin-bottom: 30px;
      box-shadow: var(--lift)
    }

    .verdict.t-likely_breach {
      background: var(--red);
      border-color: var(--red);
      color: #fff
    }

    .verdict.t-likely_breach .vconf,
    .verdict.t-likely_breach .vcid {
      color: #FFD9E0
    }

    .verdict.t-likely_breach .vhead {
      color: #fff
    }

    .verdict.t-likely_breach .vbadge {
      background: #fff;
      color: var(--red-dk);
      box-shadow: none
    }

    .vmeta {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap
    }

    .vconf {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500
    }

    .vcid {
      margin-left: auto;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted)
    }

    .vword {
      margin-top: 12px;
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -.6px;
      animation: stamp .6s var(--ease) both .08s
    }

    .vword::first-letter {
      text-transform: uppercase
    }

    .vhead {
      margin: 12px 0 0;
      font-family: var(--serif);
      font-size: 18.5px;
      font-style: italic;
      color: var(--slate);
      max-width: 74ch;
      animation: fade .6s ease both .25s
    }

    /* ---------- collapsible sections ---------- */
    .fold {
      margin-bottom: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: box-shadow .3s var(--ease), border-color .3s
    }

    .fold.open {
      box-shadow: var(--lift)
    }

    .fold h2 {
      margin: 0
    }

    .fold-head {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      background: none;
      border: 0;
      text-align: left;
      color: inherit;
      border-radius: 12px
    }

    .fold-head:hover .chev {
      background: var(--sky-2);
      border-color: var(--blue)
    }

    .fold-title {
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 700;
      color: var(--navy);
      letter-spacing: .1px
    }

    .fold-meta {
      font-family: var(--sans);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      background: var(--card-2);
      border: 1px solid var(--line-2);
      border-radius: 20px;
      padding: 2px 10px;
      white-space: nowrap
    }

    .chev {
      margin-left: auto;
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      transition: background .2s, border-color .2s, transform .35s var(--ease)
    }

    .chev::before {
      content: "";
      width: 7px;
      height: 7px;
      border-right: 2px solid var(--navy);
      border-bottom: 2px solid var(--navy);
      transform: translateY(-2px) rotate(45deg)
    }

    .fold.open .chev {
      transform: rotate(180deg)
    }

    .fold-body {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .4s var(--ease)
    }

    .fold.open .fold-body {
      grid-template-rows: 1fr
    }

    .fold-inner {
      min-height: 0;
      overflow: hidden
    }

    .fold-pad {
      padding: 0 22px 22px;
      opacity: 0;
      transform: translateY(-4px);
      transition: opacity .3s ease, transform .35s var(--ease)
    }

    .fold.open .fold-pad {
      opacity: 1;
      transform: none;
      transition-delay: .08s
    }

    .sub {
      margin: 0 0 16px;
      font-size: 13.5px;
      color: var(--muted);
      max-width: 72ch
    }

    /* inner card */
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px
    }

    .well {
      background: var(--card-2);
      border: 1px solid var(--line-2);
      border-radius: 10px
    }

    /* ---------- evidence viewer ---------- */
    .viewer {
      overflow: hidden;
      border-radius: 10px;
      border: 1px solid var(--line)
    }

    .stage {
      background: var(--navy);
      position: relative
    }

    .viewer img {
      display: block;
      width: 100%;
      min-height: 260px;
      background: var(--navy);
      transition: opacity .18s ease
    }

    .scrub {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      background: var(--card-2)
    }

    .scrub input[type=range] {
      flex: 1;
      accent-color: var(--red)
    }

    .tick {
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--slate);
      white-space: nowrap
    }

    .tick b {
      color: var(--navy);
      font-weight: 500
    }

    .playbtn {
      border: 0;
      background: var(--navy);
      color: #fff;
      border-radius: 5px;
      padding: 7px 16px;
      font-weight: 600;
      min-width: 78px;
      transition: background .2s, transform .15s
    }

    .playbtn:hover {
      background: var(--navy-3)
    }

    .playbtn:active {
      transform: scale(.96)
    }

    .noframes {
      padding: 40px 16px;
      text-align: center;
      color: #C4D2E8;
      font-size: 13.5px
    }

    .noframes code {
      background: var(--navy-2);
      color: #fff
    }

    /* ---------- convention divergence ---------- */
    .diverge {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);
      gap: 16px;
      align-items: stretch
    }

    .conv {
      border-radius: 10px;
      padding: 22px 24px;
      border: 1px solid var(--line-2);
      background: var(--card-2);
      transition: transform .25s var(--ease), box-shadow .25s var(--ease)
    }

    .conv:hover {
      transform: translateY(-2px)
    }

    .conv.gov {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
      box-shadow: var(--lift)
    }

    .conv h3 {
      margin: 0;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--slate)
    }

    .conv.gov h3 {
      color: #fff
    }

    .conv .gloss {
      margin: 6px 0 16px;
      font-family: var(--serif);
      font-size: 14px;
      color: var(--muted)
    }

    .conv.gov .gloss {
      color: #B3C3DE
    }

    .conv .big {
      font-family: var(--mono);
      font-size: 30px;
      font-weight: 500;
      color: var(--navy);
      font-variant-numeric: tabular-nums
    }

    .conv.gov .big {
      font-size: 46px;
      color: #fff
    }

    .conv .unit {
      font-size: 13.5px;
      color: var(--muted);
      margin-left: 5px
    }

    .conv.gov .unit {
      color: #B3C3DE
    }

    .conv .note {
      margin: 12px 0 0;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--slate)
    }

    .conv.gov .note {
      border-top-color: var(--navy-3);
      color: #D5DEEC
    }

    .govtag {
      display: inline-block;
      margin-left: 10px;
      padding: 2px 7px;
      border-radius: 3px;
      background: var(--red);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: .5px;
      vertical-align: 1px
    }

    /* ---------- reasoning ---------- */
    .step {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 16px;
      padding: 18px 0;
      border-top: 1px solid var(--line-2)
    }

    .step:first-child {
      border-top: 0;
      padding-top: 4px
    }

    .stepn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--navy);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 12.5px;
      font-weight: 500
    }

    .claim {
      margin: 2px 0 0;
      max-width: 80ch;
      font-family: var(--serif);
      font-size: 16.5px;
      line-height: 1.5
    }

    .principle {
      margin: 8px 0 0;
      font-family: var(--serif);
      font-style: italic;
      font-size: 14.5px;
      color: var(--slate);
      max-width: 80ch
    }

    .refs {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .ref {
      border: 1px solid var(--line);
      background: var(--card-2);
      border-radius: 4px;
      padding: 3px 9px;
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--muted);
      cursor: default;
      transition: background .18s, color .18s, border-color .18s, transform .18s var(--ease)
    }

    .ref[data-live="1"] {
      border-color: var(--blue);
      background: var(--sky-2);
      color: var(--navy);
      cursor: pointer
    }

    .ref[data-live="1"]:hover {
      background: var(--navy);
      border-color: var(--navy);
      color: #fff;
      transform: translateY(-1px)
    }

    /* ---------- record ---------- */
    .record {
      overflow: hidden
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px
    }

    th,
    td {
      text-align: left;
      padding: 10px 18px;
      border-bottom: 1px solid var(--line-2)
    }

    th {
      font-size: 11px;
      letter-spacing: .6px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      background: var(--card-2)
    }

    tbody tr:last-child td {
      border-bottom: 0
    }

    td.num,
    th.num {
      font-family: var(--mono);
      text-align: right;
      width: 140px
    }

    th.num {
      font-family: var(--sans)
    }

    tbody tr {
      transition: background .2s
    }

    tbody tr:hover td {
      background: var(--card-2)
    }

    tr.hot td {
      background: var(--sky);
      animation: flash .9s var(--ease)
    }

    tr.hot td.num {
      color: var(--navy);
      font-weight: 500
    }

    /* ---------- factors / caveats ---------- */
    .factors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px
    }

    .fcard {
      padding: 20px 22px;
      border-radius: 10px;
      border: 1px solid
    }

    .fcard h3 {
      margin: 0 0 12px;
      font-family: var(--serif);
      font-size: 18px;
      font-weight: 700
    }

    .fcard.against {
      background: var(--red-tint);
      border-color: #F2B8C3
    }

    .fcard.against h3 {
      color: var(--red-dk)
    }

    .fcard.for {
      background: var(--sky-2);
      border-color: #A9DDF7
    }

    .fcard.for h3 {
      color: var(--navy)
    }

    ul.plain {
      margin: 0;
      padding-left: 18px;
      font-family: var(--serif);
      font-size: 15.5px
    }

    ul.plain li {
      margin-bottom: 9px;
      max-width: 64ch
    }

    .fcard.against li::marker {
      color: var(--red)
    }

    .fcard.for li::marker {
      color: var(--navy)
    }

    .cav {
      padding: 14px 0;
      border-top: 1px solid var(--line-2);
      font-family: var(--serif);
      font-size: 15px;
      color: var(--slate);
      max-width: 80ch
    }

    .cav:first-child {
      border-top: 0;
      padding-top: 0
    }

    .cf {
      margin-top: 8px;
      padding: 16px 18px;
      border-radius: 10px;
      background: var(--card-2);
      border: 1px solid var(--line-2);
      font-family: var(--serif);
      font-size: 15px;
      color: var(--slate)
    }

    .cf b {
      color: var(--navy);
      font-family: var(--sans);
      font-size: 13px;
      letter-spacing: .3px;
      text-transform: uppercase;
      margin-right: 6px
    }

    /* ---------- decision (fixed, not collapsible) ---------- */
    .decision {
      margin-top: 30px
    }

    .decision h2 {
      margin: 0 0 4px;
      font-family: var(--serif);
      font-size: 22px;
      font-weight: 700;
      color: var(--navy)
    }

    .decide {
      padding: 24px;
      box-shadow: var(--lift);
      border-radius: 12px
    }

    .acts {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px
    }

    .act {
      border: 1px solid var(--line);
      background: var(--card-2);
      border-radius: 5px;
      padding: 10px 18px;
      font-weight: 600;
      color: var(--ink);
      transition: background .2s, color .2s, border-color .2s, transform .15s var(--ease)
    }

    .act:hover {
      border-color: var(--navy);
      transform: translateY(-1px)
    }

    .act:active {
      transform: scale(.97)
    }

    .act.confirm {
      border-color: var(--red);
      color: var(--red-dk);
      background: var(--red-tint)
    }

    .act.confirm:hover {
      background: #F8D2D9
    }

    .act[aria-pressed="true"] {
      color: #fff;
      border-color: transparent
    }

    .act.confirm[aria-pressed="true"] {
      background: var(--red)
    }

    .act.dismiss[aria-pressed="true"] {
      background: var(--navy)
    }

    .act.defer[aria-pressed="true"] {
      background: var(--slate)
    }

    textarea {
      width: 100%;
      min-height: 84px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      font-family: var(--serif);
      font-size: 15px;
      resize: vertical;
      background: var(--card-2);
      color: var(--ink);
      transition: background .2s, border-color .2s
    }

    textarea:focus {
      outline: 2px solid var(--blue);
      outline-offset: -1px;
      background: var(--card)
    }

    .saved {
      margin-top: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--navy);
      min-height: 20px
    }

    .saved.show {
      animation: rise .35s var(--ease) both
    }

    code {
      font-family: var(--mono);
      font-size: 12.5px;
      background: var(--card-2);
      padding: 2px 6px;
      border-radius: 3px
    }

    /* ---------- loader / 404 ---------- */
    .gate {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px
    }

    .panel {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--lift);
      overflow: hidden;
      animation: rise .55s var(--ease) both
    }

    .panel-top {
      background: var(--navy);
      color: #fff;
      padding: 26px 30px 24px
    }

    .panel-top .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #8EA3C6
    }

    .panel-top h1 {
      margin: 6px 0 0;
      font-family: var(--serif);
      font-size: 28px;
      font-weight: 700
    }

    .panel-body {
      padding: 24px 30px 28px
    }

    .panel-body p {
      margin: 0 0 16px;
      color: var(--slate)
    }

    .code {
      margin-top: 6px;
      font-family: var(--display);
      font-optical-sizing: auto;
      font-size: 46px;
      font-weight: 700;
      line-height: 1;
      color: #fff;
      letter-spacing: -.8px;
      animation: stamp .7s var(--ease) both .1s
    }

    .code span {
      color: var(--red)
    }

    .issues {
      margin: 0 0 20px;
      padding: 14px 16px 14px 34px;
      background: var(--red-tint);
      border: 1px solid #F2B8C3;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 12.5px;
      color: var(--red-dk)
    }

    .issues li {
      margin: 3px 0
    }

    .issues li {
      animation: slideIn .35s var(--ease) both;
      animation-delay: calc(.25s + var(--i, 0) * 60ms)
    }

    .pick {
      display: inline-block;
      background: var(--red);
      color: #fff;
      padding: 11px 22px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, transform .15s var(--ease)
    }

    .pick:hover {
      background: var(--red-dk);
      transform: translateY(-1px)
    }

    .pick input {
      display: none
    }

    .hint {
      margin-top: 18px;
      font-size: 12.5px;
      color: var(--muted)
    }

    .loading {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 6px
    }

    .loading i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--navy);
      animation: pulse 1s ease-in-out infinite
    }

    .loading i:nth-child(2) {
      animation-delay: .15s
    }

    .loading i:nth-child(3) {
      animation-delay: .3s
    }

    @media (max-width:900px) {
      .wrap {
        grid-template-columns: 1fr;
        height: auto
      }

      .rail {
        height: auto
      }

      .docket {
        max-height: 240px
      }

      main {
        padding: 20px 16px 48px
      }

      .factors,
      .diverge {
        grid-template-columns: 1fr
      }

      .vword {
        font-size: 36px
      }

      .vcid {
        margin-left: 0;
        width: 100%
      }

      .fold-head {
        padding: 14px 16px
      }

      .fold-pad {
        padding: 0 16px 18px
      }

      .fold-meta {
        display: none
      }

      .code {
        font-size: 36px
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }
    }

    :focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    const $ = (s, r = document) => r.querySelector(s);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const words = v => String(v || "").replace(/_/g, " ");
    const statLabel = k => String(k)
      .replace(/_seconds$/, " (s)").replace(/_s$/, " (s)").replace(/_m$/, " (m)")
      .replace(/_kmh$/, " (km/h)").replace(/_estimate$/, " estimate")
      .replace(/_/g, " ").replace(/^ttc/, "TTC").replace(/ ttc /, " TTC ");
    const num = v => typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(v < 10 ? 3 : 2)) : v;
    const reduceMotion = () => matchMedia("(prefers-reduced-motion:reduce)").matches;
    const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;

    let DOC = null, idx = 0, timer = null, firstDocket = true;
    const decisions = {};
    /* which sections are open — remembered across cases */
    const foldState = { evidence: true, convention: true, reasoning: true, record: false, factors: true, limits: false };

    /* ============ boot ============ */
    showLoading();
    fetch("cases.json")
      .then(r => {
        if (!r.ok) { showLoader(); return null; }   // no cases.json beside the page — just ask for one
        return r.text();
      })
      .then(txt => { if (txt != null) accept(txt, "cases.json"); })
      .catch(() => showLoader());   // file:// or no server — ask for the file instead

    function accept(txt, name) {
      let d;
      try { d = JSON.parse(txt); }
      catch (err) { showError({ kind: "misfit", name, issues: ["Not valid JSON — " + err.message] }); return; }
      const issues = validateDoc(d);
      if (issues.length) { showError({ kind: "misfit", name, issues }); return; }
      DOC = d; idx = 0; firstDocket = true; render();
    }

    /* check the file has the shape this page expects */
    function validateDoc(d) {
      const p = [];
      if (!d || typeof d !== "object" || Array.isArray(d))
        return [`Top level must be an object — found ${Array.isArray(d) ? "an array" : d === null ? "null" : typeof d}.`];
      if (!("cases" in d)) p.push('Missing "cases" — expected an array of case objects.');
      else if (!Array.isArray(d.cases)) p.push(`"cases" must be an array — found ${typeof d.cases}.`);
      else d.cases.forEach((c, i) => {
        if (!c || typeof c !== "object" || Array.isArray(c)) { p.push(`cases[${i}] is not an object.`); return; }
        if (!c.case_id) p.push(`cases[${i}] has no case_id.`);
        if (c.evidence != null && typeof c.evidence !== "object") p.push(`cases[${i}].evidence must be an object.`);
        if (c.evidence?.aggregates != null && typeof c.evidence.aggregates !== "object") p.push(`cases[${i}].evidence.aggregates must be an object.`);
        if (c.verdict && typeof c.verdict === "object" && !c.verdict.verdict) p.push(`cases[${i}].verdict has no "verdict" field.`);
        if (c.frames != null && !Array.isArray(c.frames)) p.push(`cases[${i}].frames must be an array.`);
      });
      return p.length > 8 ? [...p.slice(0, 8), `…and ${p.length - 8} more.`] : p;
    }

    /* ============ gate screens ============ */
    const pickerHTML = label => `<label class="pick">${label}<input type="file" id="pick" accept=".json,application/json"></label>`;
    function wirePicker() {
      const inp = $("#pick"); if (!inp) return;
      inp.onchange = e => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader(); rd.onload = () => accept(rd.result, f.name); rd.readAsText(f);
      };
    }
    function showLoading() {
      $("#app").innerHTML = `<div class="gate"><div class="panel"><div class="panel-body" style="text-align:center;padding:34px">
    <p style="margin-bottom:12px">Opening case file…</p><div class="loading"><i></i><i></i><i></i></div></div></div></div>`;
    }
    function showLoader() {
      $("#app").innerHTML = `<div class="gate"><div class="panel">
    <div class="panel-top"><div class="eyebrow">Adjudication desk</div><h1>Open a case file</h1></div>
    <div class="panel-body">
      <p>Load the <code>cases.json</code> produced by <code>build_case_file.py</code>.</p>
      ${pickerHTML("Choose cases.json")}
      <p class="hint">Review frames only load when this page is served from the same folder —
        run <code>python -m http.server</code> there.</p></div></div></div>`;
      wirePicker();
    }
    function showError({ name, issues = [] }) {
      $("#app").innerHTML = `<div class="gate"><div class="panel">
    <div class="panel-top"><div class="eyebrow">Adjudication desk</div>
      <div class="code">Wrong file<span>.</span></div></div>
    <div class="panel-body">
      <p><code>${esc(name || "That file")}</code> isn't a case file this desk can open.
         Choose the <code>cases.json</code> produced by <code>build_case_file.py</code>.</p>
      ${issues.length ? `<ul class="issues">${issues.map((x, i) => `<li style="--i:${i}">${esc(x)}</li>`).join("")}</ul>` : ""}
      ${pickerHTML("Choose another file")}
      <p class="hint">Expected shape: <code>{ "cases": [ { "case_id", "evidence", "verdict", "frames" } ] }</code></p>
    </div></div></div>`;
      wirePicker();
    }

    /* ============ desk ============ */
    function render() {
      const cases = DOC.cases;
      if (!cases.length) {
        $("#app").innerHTML = `<div class="gate"><div class="panel">
      <div class="panel-top"><div class="eyebrow">Adjudication desk</div><h1>No cases in this file</h1></div>
      <div class="panel-body"><p>The pipeline found no following segments to adjudicate.</p>
      ${pickerHTML("Choose another file")}</div></div></div>`;
        wirePicker(); return;
      }
      $("#app").innerHTML = `<div class="wrap">
    <nav class="rail">
      <header><div class="eyebrow">Following-distance review</div>
        <h1>Adjudication desk</h1>
        ${DOC.site_id ? `<div class="site">${esc(DOC.site_id)}</div>` : ""}</header>
      <div class="count">${plural(cases.length, "case")} in docket</div>
      <div class="docket" id="docket"></div>
      <footer>${DOC.generated_utc ? `Case made ${esc(String(DOC.generated_utc).slice(0, 16).replace("T", " "))} UTC` : ""}
        ${DOC.reproducible === false ? "<br>Run not reproducible" : ""}</footer>
    </nav>
    <main id="main"></main></div>`;
      drawDocket(); drawCase();
    }

    function drawDocket() {
      const dk = $("#docket");
      dk.classList.toggle("first", firstDocket); firstDocket = false;
      dk.innerHTML = DOC.cases.map((c, i) => {
        const v = c.verdict?.verdict || "pending", e = c.evidence || {};
        return `<button class="case-btn" data-i="${i}" style="--i:${i}" aria-current="${i === idx}">
      <span class="cid">${esc(c.case_id)}</span>
      <span class="pair">${esc(words(e.follower_vehicle_class) || "vehicle")} behind ${esc(words(e.lead_vehicle_class) || "vehicle")}
        ${e.duration_s != null ? `· ${esc(e.duration_s)}s` : ""}</span>
      <span class="vbadge v-${esc(v)}">${esc(words(v))}</span></button>`;
      }).join("");
      dk.querySelectorAll(".case-btn").forEach(b => b.onclick = () => {
        if (+b.dataset.i === idx) return;
        idx = +b.dataset.i; stopPlay(); drawDocket(); drawCase(); $("#main").scrollTop = 0;
      });
    }

    /* collapsible section */
    function fold(id, title, meta, body, sub, i) {
      const open = !!foldState[id];
      return `<section class="fold rise${open ? " open" : ""}" data-fold="${id}" style="--i:${i}">
    <h2><button class="fold-head" aria-expanded="${open}" aria-controls="fb-${id}">
      <span class="fold-title">${title}</span>
      ${meta ? `<span class="fold-meta">${meta}</span>` : ""}
      <span class="chev" aria-hidden="true"></span></button></h2>
    <div class="fold-body" id="fb-${id}" ${open ? "" : "inert"}><div class="fold-inner"><div class="fold-pad">
      ${sub ? `<p class="sub">${sub}</p>` : ""}${body}</div></div></div></section>`;
    }
    function setFold(sec, open) {
      sec.classList.toggle("open", open);
      sec.querySelector(".fold-head").setAttribute("aria-expanded", open);
      const body = sec.querySelector(".fold-body");
      open ? body.removeAttribute("inert") : body.setAttribute("inert", "");
      foldState[sec.dataset.fold] = open;
    }
    function wireFolds() {
      $("#main").querySelectorAll(".fold").forEach(sec => {
        sec.querySelector(".fold-head").onclick = () => setFold(sec, !sec.classList.contains("open"));
      });
    }

    function drawCase() {
      const c = DOC.cases[idx], e = c.evidence || {}, a = e.aggregates || {}, v = c.verdict;
      if (!v) {
        $("#main").innerHTML = `<div class="inner rise"><div class="verdict"><div class="vword">No verdict</div>
    <p class="vhead">This case was built with <code>--dry-run</code>, so there's nothing to adjudicate yet.</p></div></div>`; return;
      }

      const govClear = a.sustained_clearance_below_3s_seconds != null;
      const steps = v.reasoning_chain || [], agg = v.aggravating_factors || [], mit = v.mitigating_factors || [];
      const cavs = v.perception_caveats || [], cf = v.counterfactual;
      const stats = Object.entries(a).filter(([, x]) => x !== null);
      const frames = c.frames || [];
      let i = 1;

      const secs = [];
      secs.push(fold("evidence", "Evidence", frames.length ? plural(frames.length, "frame") : "no frames",
        `<div class="viewer" id="viewer"></div>`,
        "Scrub the segment. The left panel confirms the system tracked the right two vehicles; the right panel shows their true spacing, which perspective hides.", i++));

      if (govClear) secs.push(fold("convention", "Measurement convention", "2 readings",
        `<div class="diverge">
      <div class="conv gov"><h3>Clear road ahead<span class="govtag">GOVERNING</span></h3>
        <p class="gloss">Road between the vehicles, excluding the follower's own length.</p>
        <span class="big" data-count="${esc(a.sustained_clearance_below_3s_seconds)}">${num(a.sustained_clearance_below_3s_seconds)}</span><span class="unit">s under 3 s</span>
        <p class="note">Median ${num(a.median_clearance_s)} s · minimum ${num(a.min_clearance_s)} s</p></div>
      <div class="conv"><h3>Rear to rear</h3>
        <p class="gloss">Distance between rear contact points, counting the follower's body.</p>
        <span class="big" data-count="${esc(a.sustained_below_3s_seconds)}">${num(a.sustained_below_3s_seconds)}</span><span class="unit">s under 3 s</span>
        <p class="note">Median ${num(a.median_gap_s)} s · minimum ${num(a.min_gap_s)} s</p></div>
    </div>`,
        "These two readings of the same footage disagree, and the verdict depends on which one governs. Both are shown rather than resolved silently.", i++));

      secs.push(fold("reasoning", "Reasoning", plural(steps.length, "step"),
        steps.map(s => `<div class="step">
      <div class="stepn">${esc(s.step)}</div><div>
        <p class="claim">${esc(s.claim)}</p>
        ${s.legal_principle ? `<p class="principle">${esc(s.legal_principle)}</p>` : ""}
        <div class="refs">${(s.evidence_refs || []).map(r => {
          const k = statKey(r, a);
          return `<button class="ref" data-stat="${esc(k || "")}" data-live="${k ? 1 : 0}">${esc(r)}</button>`;
        }).join("")}</div></div></div>`).join("") || `<p class="sub">No reasoning recorded.</p>`,
        "Each step names the evidence it rests on. Select a highlighted citation to find that figure in the record.", i++));

      secs.push(fold("record", "Record", plural(stats.length, "measurement"),
        `<div class="card record"><table id="stats"><thead><tr><th>Measurement</th><th class="num">Value</th></tr></thead>
      <tbody>${stats.map(([k, x]) => `<tr data-k="${esc(k)}"><td>${esc(statLabel(k))}</td><td class="num">${num(x)}</td></tr>`).join("")
        || `<tr><td colspan="2">No measurements recorded.</td></tr>`}</tbody></table></div>`, "", i++));

      secs.push(fold("factors", "Factors", `${agg.length} against · ${mit.length} for`,
        `<div class="factors">
      <div class="fcard against"><h3>Weighs against</h3><ul class="plain">${agg.map(f => `<li>${esc(f.factor)}</li>`).join("") || "<li>None recorded.</li>"}</ul></div>
      <div class="fcard for"><h3>Weighs for</h3><ul class="plain">${mit.map(f => `<li>${esc(f.factor)}</li>`).join("") || "<li>None recorded.</li>"}</ul></div>
    </div>`, "", i++));

      if (cavs.length || cf) secs.push(fold("limits", "Limits of this evidence", plural(cavs.length, "caveat"),
        `${cavs.map(x => `<div class="cav">${esc(x)}</div>`).join("")}
     ${cf ? `<div class="cf"><b>What would change it</b>${esc(cf)}</div>` : ""}`, "", i++));

      $("#main").innerHTML = `<div class="inner">
    <header class="verdict rise t-${esc(v.verdict)}" style="--i:0">
      <div class="vmeta"><span class="vbadge v-${esc(v.verdict)}">Recommendation</span>
        ${v.confidence ? `<span class="vconf">${esc(v.confidence)} confidence</span>` : ""}
        <span class="vcid">${esc(c.case_id)}</span></div>
      <div class="vword">${esc(words(v.verdict))}</div>
      ${v.headline ? `<p class="vhead">${esc(v.headline)}</p>` : ""}
    </header>

    ${secs.join("")}

    <section class="decision rise" style="--i:${i}">
      <h2>Your verdict</h2>
      <p class="sub">The recommendation above is advisory. Nothing is issued until you decide.</p>
      <div class="card decide">
        <div class="acts">
          <button class="act confirm" data-d="confirm" aria-pressed="false">Confirm the breach</button>
          <button class="act dismiss" data-d="dismiss" aria-pressed="false">Dismiss the case</button>
          <button class="act defer"  data-d="defer"   aria-pressed="false">Send for longer footage</button>
        </div>
        <textarea id="note" placeholder="Why — for the case record."></textarea>
        <div class="saved" id="saved"></div>
      </div></section>
  </div>`;

      buildViewer(c); wireFolds(); wireRefs(); wireDecision(c); countUp();
    }

    /* numbers in the convention cards tick up once */
    function countUp() {
      if (reduceMotion()) return;
      $("#main").querySelectorAll("[data-count]").forEach(el => {
        const target = parseFloat(el.dataset.count); if (!isFinite(target)) return;
        const dec = Number.isInteger(target) ? 0 : (target < 10 ? 3 : 2), t0 = performance.now(), dur = 700;
        const step = t => {
          const p = Math.min(1, (t - t0) / dur), k = 1 - Math.pow(1 - p, 3);
          el.textContent = (target * k).toFixed(dec); if (p < 1) requestAnimationFrame(step); else el.textContent = num(target);
        };
        requestAnimationFrame(step);
      });
    }

    /* map an evidence_ref string onto a key in aggregates */
    function statKey(ref, a) {
      const cleaned = String(ref).replace(/^aggregates?\./, "").replace(/\s*\(.*\)$/, "")
        .replace(/=.*$/, "").trim();
      if (cleaned in a) return cleaned;
      const hit = Object.keys(a).find(k => cleaned.endsWith(k) || k === cleaned);
      return hit || null;
    }

    function wireRefs() {
      $("#main").querySelectorAll(".ref[data-live='1']").forEach(b => b.onclick = () => {
        const row = $(`#stats tr[data-k="${b.dataset.stat}"]`);
        if (!row) return;
        const sec = row.closest(".fold"), wasOpen = sec.classList.contains("open");
        if (!wasOpen) setFold(sec, true);
        $("#main").querySelectorAll("#stats tr").forEach(r => r.classList.remove("hot"));
        void row.offsetWidth;            // restart the flash animation
        row.classList.add("hot");
        setTimeout(() => row.scrollIntoView({ block: "center", behavior: reduceMotion() ? "auto" : "smooth" }), wasOpen ? 0 : 380);
      });
    }

    function buildViewer(c) {
      const fr = c.frames || [], box = $("#viewer");
      if (!fr.length) { box.innerHTML = `<div class="stage"><div class="noframes">No review frames for this case.</div></div>`; return; }
      let i = 0;
      box.innerHTML = `<div class="stage"><img id="fimg" alt="Camera view and bird's-eye projection">
    <div id="imgerr" class="noframes" hidden>Frame image not found. Serve this page from the folder holding <code>case_frames/</code>.</div></div>
    <div class="scrub">
      <button class="playbtn" id="play">Play</button>
      <input type="range" id="rng" min="0" max="${fr.length - 1}" value="0" aria-label="Frame within segment">
      <span class="tick" id="tick"></span></div>`;
      $("#fimg").onerror = () => { $("#fimg").hidden = true; $("#imgerr").hidden = false; };
      $("#fimg").onload = () => { $("#fimg").hidden = false; $("#imgerr").hidden = true; };
      const show = k => {
        i = k; const f = fr[k] || {};
        $("#fimg").src = f.file || "";
        const t = Number(f.t);
        $("#tick").innerHTML = `t <b>${isFinite(t) ? t.toFixed(2) : "–"}</b> s · gap <b>${esc(f.gap_m ?? "–")}</b> m · headway <b>${esc(f.gap_s ?? "–")}</b> s`;
        $("#rng").value = k;
      };
      $("#rng").oninput = ev => { stopPlay(); show(+ev.target.value); };
      $("#play").onclick = () => {
        if (timer) { stopPlay(); return; }
        $("#play").textContent = "Pause";
        timer = setInterval(() => { show((i + 1) % fr.length); }, 380);
      };
      show(0);
    }
    function stopPlay() { if (timer) { clearInterval(timer); timer = null; const p = $("#play"); if (p) p.textContent = "Play"; } }

    function wireDecision(c) {
      const saved = $("#saved");
      const flag = d => { saved.textContent = label(d); saved.classList.remove("show"); void saved.offsetWidth; saved.classList.add("show"); };
      const prev = decisions[c.case_id];
      if (prev) {
        $("#note").value = prev.note || "";
        const b = $(`#main .act[data-d="${prev.d}"]`); if (b) b.setAttribute("aria-pressed", "true");
        saved.textContent = label(prev.d);
      }
      $("#main").querySelectorAll(".act").forEach(b => b.onclick = () => {
        $("#main").querySelectorAll(".act").forEach(o => o.setAttribute("aria-pressed", "false"));
        b.setAttribute("aria-pressed", "true");
        decisions[c.case_id] = { d: b.dataset.d, note: $("#note").value };
        flag(b.dataset.d);
      });
      $("#note").oninput = () => { const d = decisions[c.case_id]; if (d) { d.note = $("#note").value; } };
    }
    const label = d => ({
      confirm: "Breach confirmed. Recorded against this case.",
      dismiss: "Case dismissed. Recorded against this case.",
      defer: "Sent for longer footage. Recorded against this case."
    }[d] || "");
  </script>
</body>

</html>
